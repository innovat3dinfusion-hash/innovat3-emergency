<script>
/* Short tag links: innovat3.co.za/t/26K7M2Q9  ->  /card/?tag=IN3-2026-K7M2Q9
   Also accepts old IDs: /t/IN3-2026-B073. Works on GitHub Pages (any unknown path loads this page). */
(function () {
  var m = location.pathname.match(/^\/t\/([A-Za-z0-9-]{3,24})\/?$/i);
  if (!m) return;
  var code = m[1].toUpperCase(), id = null;
  if (/^\d\d[A-Z0-9]{6}$/.test(code)) id = 'IN3-20' + code.slice(0, 2) + '-' + code.slice(2);
  else if (/^IN3-20\d\d-[A-Z0-9]{3,8}$/.test(code)) id = code;
  if (id) location.replace('/card/?tag=' + encodeURIComponent(id));
})();
</script>
